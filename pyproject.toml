[project]
name = "gapp-scrapper"
version = "0.1.0"
description = "CLI explorer for Google Apps Script Web Apps."
authors = [
    {name = "Santiago", email = "santimalirat@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer (>=0.12.0)",
    "playwright (>=1.40.0)",
    "keyring (>=24.0)"
]

[tool.poetry]
packages = [{include = "gapp_scrapper"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
gapp-scrapper = "gapp_scrapper.cli:app"
gapp = "gapp_scrapper.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
